<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIKA-А4 · Уведомления</title><link rel="stylesheet" href="/styles.css"><script defer src="/vue.js"></script><script defer src="/components.js"></script><script defer src="/app.js"></script></head>
<body class="print-blocked"><div id="app" v-cloak>
<aside class="sidebar"><button class="brand" @click="navigate('home')">Express <strong>Rika</strong><small>УВЕДОМЛЕНИЯ А4</small></button><nav><button class="active" @click="navigate('home')">▤ &nbsp; Главная</button></nav><div class="sidebar-bottom">Локальная демонстрация<small>Доступ не разграничен</small></div></aside>
<div class="workspace"><header class="topbar"><span>RIKA-А4 / <b>{{({home:'Главная',archive:'Архив',edit:'Создание',legacy:'Архивная запись',preview:'Просмотр А4'})[page]}}</b></span><label class="branch-selector">Филиал <select aria-label="Филиал" :value="branchId" @change="changeBranch" :disabled="!!recordId&&['edit','preview','legacy'].includes(page)"><option v-for="b in branches" :value="b.branch_id">{{b.branch_name}}</option></select></label></header>
<main><div v-if="error&&page!=='edit'" class="alert" role="alert">{{error}}</div><div v-if="notice" class="notice" role="status">{{notice}}</div>
<template v-if="page==='home'"><section class="start-screen"><h1>Уведомления</h1><div class="start-actions"><button class="start-action create-action" aria-label="Создать уведомление" @click="create"><span>＋</span><strong>Создать уведомление</strong></button><button class="start-action" aria-label="Архив" @click="navigate('archive')"><span>▤</span><strong>Архив</strong></button></div></section></template>
<template v-else-if="page==='archive'">
 <button class="text-button" @click="navigate('home')">← На главный экран</button><div class="page-heading"><h1>Архив</h1><button class="primary" @click="create">Создать уведомление</button></div>
 <section class="card filters"><label>Создано с<input type="date" v-model="filters.from"></label><label>Создано по<input type="date" v-model="filters.to"></label><label>Заказчик<input v-model="filters.customer" placeholder="Название заказчика"></label><label>Номер накладной<input v-model="filters.waybill" placeholder="Поиск по номеру"></label><button class="secondary" @click="resetFilters">Сбросить</button></section><p class="subtle">Записи филиала «{{branch.branch_name}}». Фильтрация не заменяет авторизацию.</p>
 <section class="card table-scroll"><table v-if="shownRecords.length"><thead><tr><th>Создано / исходящий</th><th>Накладная / дата заказа</th><th>Заказчик / получатель</th><th>Итог</th><th></th></tr></thead><tbody><tr v-for="r in shownRecords" :key="r.id"><td>{{formatDate(r.created_at.slice(0,10))}}<small v-if="r.document.outgoing_number">Исх. № {{r.document.outgoing_number}} / {{r.document.notification_date?.slice(0,4)}}</small></td><td><b>{{r.document.waybill}}</b><small>{{formatDate(r.document.order_date||r.document.waybill_date)}}</small></td><td>{{r.document.customer}}<small>{{r.document.recipient}}</small></td><td>{{kinds[kind(r.document)]}}<small v-if="r.document.schema_version!==4">Архивная версия</small></td><td><button class="text-button" @click="openRecord(r.id)">Открыть →</button></td></tr></tbody></table><div v-else class="empty"><h2>Уведомления не найдены</h2><p>Создайте уведомление или измените фильтры.</p></div></section>
</template>
<template v-else>
 <button class="text-button" @click="navigate('home')">← На главный экран</button><div class="page-heading"><div><h1>{{recordId?'Уведомление № '+(savedDoc?.outgoing_number||recordId):'Новое уведомление'}}</h1><p v-if="page==='edit'">Данные заказа → история состоявшихся событий.</p></div><button v-if="recordId" class="secondary" @click="copyRecord">Создать копию</button><button v-if="recordId&&readonlyArchive&&!versionView" class="secondary" @click="edit">Редактировать</button><button v-if="recordId" class="text-button" @click="loadVersions">Архивные версии</button><button v-if="versionView" class="text-button" @click="openRecord(recordId)">Вернуться к текущей записи</button></div>
 <section v-if="versions.length" class="card form-section archive-versions"><h2>Сохранённые прежние версии</h2><button v-for="version in versions" :key="version.revision" class="text-button version-button" @click="showVersion(version)">Открыть версию {{version.revision}}</button></section>
 <section v-if="page==='legacy'" class="card form-section"><h2>Прежняя архивная запись</h2><dl><dt>Заказчик</dt><dd>{{savedDoc.customer}}</dd><dt>Адресат в прежнем документе</dt><dd>{{savedDoc.addressee}}</dd><dt>Получатель</dt><dd>{{savedDoc.recipient}}</dd><dt>Накладная</dt><dd>{{savedDoc.waybill}}</dd><dt>Дата заказа</dt><dd>{{formatDate(savedDoc.order_date||savedDoc.waybill_date)}}</dd><dt>Адрес доставки</dt><dd>{{savedDoc.address}}</dd></dl><p>Исходные сведения сохранены. Для работы по новым правилам создайте копию.</p><details><summary>История исходной записи</summary><pre>{{JSON.stringify(savedDoc.events,null,2)}}</pre></details></section>
 <form v-show="page==='edit'" ref="editor" @submit.prevent="preview" @input="clearField($event.target.dataset.field)" class="editor-form" novalidate>
 <div v-if="!branch.can_issue" class="alert">{{branch.note}}</div>
 <section class="card form-section"><h2>Данные уведомления и заказа</h2>
  <div class="counter-strip"><div v-if="recordId"><b>Исходящий № {{savedDoc.outgoing_number}}</b><small>При редактировании номер сохраняется.</small></div><div v-else><b>Следующий исходящий: {{counter?.next_number??'…'}} / {{year}}</b><small>Окончательный номер выдаётся при сохранении.</small></div><button type="button" class="text-button" @click="counterOpen=!counterOpen">Установить своё значение</button></div>
  <div v-if="counterOpen" class="counter-setting"><label>Последний использованный исходящий номер<input data-field="counter.last_used" inputmode="numeric" v-model="counterValue"></label><p>Следующим будет {{/^[0-9]+$/.test(counterValue)?Number(counterValue)+1:'—'}} / {{year}} для филиала «{{branch.branch_name}}».</p><small>Например, 87 → следующее сохранённое уведомление получит 88. Счётчик назад не уменьшается.</small><button type="button" class="secondary" @click="setCounter">Применить счётчик</button><small v-if="counterError" class="field-error" role="alert">{{counterError}}</small></div>
  <div class="field-grid"><label>Дата уведомления *<input data-field="notification_date" type="date" v-model="form.notification_date"><small class="field-error" v-if="errors.notification_date">{{errors.notification_date}}</small></label><label>Дата заказа *<input data-field="order_date" type="date" v-model="form.order_date"><small class="field-error" v-if="errors.order_date">{{errors.order_date}}</small></label>
  <label>Заказчик *<textarea data-field="customer" maxlength="1000" rows="2" v-model="form.customer"></textarea><small>Это же название будет указано в шапке.</small><small class="field-error" v-if="errors.customer">{{errors.customer}}</small></label><label>Получатель корреспонденции *<input data-field="recipient" maxlength="1000" v-model="form.recipient"><small>Укажите в форме, подходящей после слова «для».</small><small class="field-error" v-if="errors.recipient">{{errors.recipient}}</small></label>
  <label>Номер накладной *<input ref="waybill" data-field="waybill" type="text" inputmode="numeric" maxlength="13" :value="form.waybill" @input="onWaybillInput" @paste="onPaste" @beforeinput="onBeforeInput" @blur="waybillTouched=true" :aria-invalid="!!waybillError&&waybillTouched"><small :class="{'field-error':waybillTouched&&waybillError}">{{waybillTouched&&waybillError?waybillError:'Ровно 13 цифр. Начальные нули сохраняются.'}}</small></label>
  <label>Адрес доставки *<textarea data-field="address" maxlength="1000" rows="2" v-model="form.address"></textarea><small class="field-error" v-if="errors.address">{{errors.address}}</small></label></div>
 </section>
 <section class="card form-section"><div class="section-heading"><h2>История событий</h2><button type="button" class="text-button" data-field="events" aria-label="Добавить событие сверху" @click="addEvent" :disabled="form.events.length>=40">＋ Добавить событие</button></div><p v-if="!form.events.length">Добавьте состоявшиеся визиты, связь с получателем или вручение.</p>
  <div v-for="(event,index) in form.events" :key="event._key" class="event-card"><div class="section-heading"><b>Событие {{index+1}}</b><button type="button" class="text-button" @click="removeEvent(event)" :aria-label="'Удалить событие '+(index+1)">Удалить</button></div>
   <div class="field-grid"><search-select label="Ситуация *" :options="options(catalog.types)" v-model="event.type" @change="changeType(event)" :path="'events.'+index+'.type'" :error="errors['events.'+index+'.type']"></search-select><label v-if="dateRequired(event)">Дата события *<input :data-field="'events.'+index+'.date'" type="date" v-model="event.date"><small v-if="errors['events.'+index+'.date']" class="field-error">{{errors['events.'+index+'.date']}}</small></label><search-select v-if="event.type&&event.type!=='other'&&!catalog.types[event.type]?.single_result" class="full" label="Результат *" :options="options(catalog.types[event.type]?.results)" v-model="event.result" @change="changeResult(event)" :path="'events.'+index+'.result'" :error="errors['events.'+index+'.result']"></search-select></div>
   <div v-if="event.type==='other'" class="alert">Нет подходящей ситуации. Выберите стандартный вариант после проверки фактов или согласуйте новую формулировку. Произвольный текст не создаётся.</div><p v-if="event.needs_review" class="field-error">{{event.review_message||'Уточните сведения из прежней записи; архивный оригинал не изменён.'}}</p>
   <div v-if="event.result" class="optional-fields"><label v-for="field in optionalFields(event)" :key="field.key" class="check"><input type="checkbox" v-model="event.fields[field.enabled_by]" @change="ensureEvent(event)"> {{field.toggle_label}}</label></div>
   <div v-if="event.type==='contact'&&event.contact_ref&&event.result!=='no_phone'" class="linked-contacts">
    <b>Связь по контактам, предоставленным отправителем</b>
    <p v-if="event.fields.phones?.length" class="subtle">Выбранные номера: {{event.fields.phones.map(p=>p.number).join(', ')}}</p>
    <p v-if="linkProblem(event)" class="field-error">{{linkProblem(event)}} Данные не удалены.</p>
    <search-select v-if="event._relink||linkProblem(event)" label="Событие с новыми контактами" :model-value="event.contact_ref.event_id" :options="contactSources(event)" @update:model-value="setContactSource(event,$event)" :path="'events.'+index+'.contact_ref'" :error="errors['events.'+index+'.contact_ref']"></search-select>
    <template v-if="sourceEvent(event)"><p class="subtle">Выберите номера, по которым предпринималась эта попытка связи:</p><label v-for="phone in sourceEvent(event).fields.new_phones" :key="phone.id" class="check"><input type="checkbox" :checked="event.contact_ref.phone_ids.includes(phone.id)" @change="selectLinkedPhone(event,phone.id,$event.target.checked)"> {{phone.number||'Номер не заполнен'}}</label><button type="button" class="text-button" @mousedown.prevent @click="updateLinkedPhones(event)">Обновить выбранные номера</button></template>
    <div class="actions"><button type="button" class="text-button" @mousedown.prevent @click="event._relink=true">Уточнить событие-источник</button><button type="button" class="text-button" @mousedown.prevent @click="detachContact(event)">Использовать исходные номера из накладной</button></div>
   </div>
   <div v-if="event.result" class="event-fields field-grid"><template v-for="field in inputFields(event)" :key="field.key"><label v-if="field.type==='checkbox'" class="check full"><input :data-field="'events.'+index+'.fields.'+field.key" type="checkbox" v-model="event.fields[field.key]"> {{field.label}}<small class="field-error" v-if="errors['events.'+index+'.fields.'+field.key]">{{errors['events.'+index+'.fields.'+field.key]}}</small></label>
   <div v-else-if="field.type==='phones'" class="phone-group full"><div class="section-heading"><b>{{field.label}} *</b><button type="button" class="text-button" @click="addPhone(event,field.key)">＋ Номер</button></div><phone-input v-for="(phone,pi) in event.fields[field.key]" :key="pi" :model-value="phone" @update:model-value="event.fields[field.key][pi]=$event;clearField('events.'+index+'.fields.'+field.key+'.'+pi+'.number')" :rules="phoneRules" :path="'events.'+index+'.fields.'+field.key+'.'+pi" :error="errors['events.'+index+'.fields.'+field.key+'.'+pi+'.number']||errors['events.'+index+'.fields.'+field.key+'.'+pi+'.country']" @remove="event.fields[field.key].splice(pi,1)"></phone-input></div>
   <label v-else>{{field.label}} *<select v-if="field.type==='select'" :data-field="'events.'+index+'.fields.'+field.key" v-model="event.fields[field.key]"><option value="">Выберите…</option><option v-for="option in options(field.options)" :value="option.value">{{option.label}}</option></select><input v-else :data-field="'events.'+index+'.fields.'+field.key" :type="field.type==='date'?'date':'text'" v-model="event.fields[field.key]" maxlength="1000"><small class="field-error" v-if="errors['events.'+index+'.fields.'+field.key]">{{errors['events.'+index+'.fields.'+field.key]}}</small></label></template></div>
   <div class="event-next-actions"><button v-if="event.type==='contact'&amp;&amp;!event.contact_ref&amp;&amp;event.result!=='no_phone'&amp;&amp;(contactSources(event).length||event.needs_review)" type="button" class="text-button" @click="attachContact(event)">Связать с новыми контактами отправителя</button><button v-if="event.type==='sender'&&event.result==='new_contacts'" type="button" class="secondary" @click="addContact(event)">Добавить связь по новым контактам</button><button v-for="action in nextActions(event)" :key="action.type" type="button" class="text-button" @click="addNext(event,action)">{{action.label}}</button></div>
  </div>
  <button type="button" class="secondary add-event-bottom" aria-label="Добавить событие снизу" @click="addEvent" :disabled="form.events.length>=40">＋ Добавить событие</button>
 </section>

 <div class="form-bottom"><div v-if="error" class="alert validation-summary" role="alert">Просмотр недоступен: {{error}}</div><button class="primary" type="submit" :disabled="busy">{{busy?'Проверяем…':'Просмотр А4'}}</button></div>
 </form>
 <section v-if="page==='preview'&&previewDoc" class="preview-area"><div class="preview-toolbar"><button v-if="!readonlyArchive" class="secondary" @click="edit">Вернуться к редактированию</button><button v-else class="secondary" @click="navigate('archive')">Вернуться в архив</button><div class="actions"><button v-if="!readonlyArchive" class="primary" @click="save" :disabled="busy||overflow">{{busy?'Сохраняем…':'Сохранить уведомление'}}</button><button class="secondary" @click="printDocument" :disabled="!printable">Печать / PDF</button></div></div><p class="subtle" v-if="numberProvisional">Номер в просмотре предварительный. Окончательный номер будет выдан при сохранении.</p><p class="subtle" v-if="!recordId||dirty">Для печати сохраните текущую версию.</p><p class="subtle" v-if="bodyPt<layout.body_pt">Основной текст уменьшен до {{bodyPt}} пт. Минимум {{layout.min_body_pt}} пт требует согласования.</p><div v-if="overflow" class="alert" role="alert">Уведомление не помещается на один А4 даже при {{layout.min_body_pt}} пт. Сократите данные без потери фактов. Сохранение и печать заблокированы; текст не обрезан.</div>
 <div class="paper-scroll"><article class="paper" :class="{'legacy-paper':readonlyArchive}" ref="paper" :style="paperStyle"><img ref="letterhead" class="original-header" :src="previewDoc.rendered.branch.header_image" alt="Шапка ТОО Рика из образца Астаны"><div class="document-main"><div class="doc-meta" ref="docmeta"><b>Исх. № {{previewDoc.outgoing_number}} от {{formatDate(previewDoc.notification_date)}} г.</b><b class="doc-addressee">{{previewDoc.addressee}}</b></div><h2 class="doc-title">УВЕДОМЛЕНИЕ</h2><div class="doc-body" ref="docbody" :style="{fontSize:bodyPt+'pt'}"><p>{{previewDoc.rendered.intro_before}}<b>{{numberPrefix(previewDoc)}}{{previewDoc.waybill}}</b><span v-for="(run,ri) in textRuns(previewDoc.rendered.intro_after)" :key="ri" :class="{nowrap:run.nowrap}">{{run.text}}</span></p><p v-for="(paragraph,index) in previewDoc.rendered.paragraphs" :key="index" :class="{receipt:kind(previewDoc)==='delivery'&&paragraph.startsWith('В получении')}"><span v-for="(run,ri) in textRuns(paragraph)" :key="ri" :class="{nowrap:run.nowrap}">{{run.text}}</span></p></div></div><div class="doc-signature" ref="signature"><div class="signature-first">{{previewDoc.rendered.branch.position_lines[0]}}</div><div class="signature-grid"><b>{{previewDoc.rendered.branch.position_lines[1]}}</b><b>{{previewDoc.rendered.branch.signer}}</b></div><div class="signature-phone">{{previewDoc.rendered.branch.footer_phone}}</div></div></article></div><p class="print-hint">Печать: А4, масштаб 100%, без браузерных колонтитулов. Просмотр и печать используют один документ.</p></section>
</template></main></div></div><div class="print-warning">Откройте просмотр А4, исправьте ошибки и сохраните уведомление перед печатью.</div><noscript>Для работы включите JavaScript.</noscript></body></html>
